[workspace]
members = [
    "crates/synchole",
    "crates/synchole-bindings",
    "crates/synchole-core",
    "crates/synchole-discovery",
    "crates/synchole-identity",
    "crates/synchole-nat",
    "crates/synchole-relay",
    "crates/synchole-storage",
    "crates/synchole-sync",
    "crates/synchole-transport",
]
resolver = "2"

[workspace.package]
authors = ["Synchole Contributors"]
categories = ["network-programming", "database", "wasm"]
description = "Multiplatform device-to-device synchronization framework."
edition = "2021"
homepage = "https://github.com/synchole/synchole"
keywords = ["sync", "p2p", "sqlite", "offline-first", "wasm"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/synchole/synchole"
rust-version = "1.78"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bincode = "1"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "0.10"
criterion = "0.5"
ed25519-dalek = "2"
futures = "0.3"
jni = "0.21"
libc = "0.2"
postcard = "1"
proptest = "1"
rand_core = "0.6"
rkyv = "0.7"
rusqlite = "0.32"
serde = "1"
serde_json = "1"
serde-wasm-bindgen = "0.6"
tempfile = "3"
thiserror = "1"
tokio = "1"
tracing = "0.1"
uniffi = "0.28"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
